name: virustotal
# 릴리스를 올리면 첨부 zip을 VirusTotal에 올려 검사하고, 결과를 릴리스 설명 끝에 붙인다.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '다시 검사할 릴리스 태그 (예: v1.1.1)'
        required: true
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: 첨부 파일 받기
        run: gh release download "$TAG" --pattern '*.zip' --dir assets
      - name: VirusTotal 검사
        run: |
          set -euo pipefail
          : > results.md
          for f in assets/*.zip; do
            name=$(basename "$f")
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            id=$(curl -sf -H "x-apikey: $VT_API_KEY" -F "file=@$f" https://www.virustotal.com/api/v3/files | jq -r .data.id)
            for i in $(seq 1 60); do
              sleep 20
              r=$(curl -sf -H "x-apikey: $VT_API_KEY" "https://www.virustotal.com/api/v3/analyses/$id")
              [ "$(jq -r .data.attributes.status <<<"$r")" = completed ] && break
            done
            [ "$(jq -r .data.attributes.status <<<"$r")" = completed ] || { echo "검사가 20분 안에 끝나지 않았어요"; exit 1; }
            bad=$(jq '.data.attributes.stats | .malicious + .suspicious' <<<"$r")
            total=$(jq '.data.attributes.stats | .malicious + .suspicious + .undetected + .harmless' <<<"$r")
            echo "| \`$name\` | \`$sha\` | **탐지 $bad / $total** – https://www.virustotal.com/gui/file/$sha |" >> results.md
            echo "$name: $bad / $total"
          done
      - name: 릴리스 설명에 결과 붙이기
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body -q .body > body.md
          # 예전 자동 검사 결과가 있으면 지우고 새로 붙인다
          sed -i '/<!-- virustotal -->/,/<!-- \/virustotal -->/d' body.md
          {
            echo
            echo '<!-- virustotal -->'
            echo "### VirusTotal 자동 검사 ($(date -u +%Y-%m-%d) UTC, GitHub Actions)"
            echo '| 파일 | SHA-256 | 결과 |'
            echo '|---|---|---|'
            cat results.md
            echo
            echo "검사 기록: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo '<!-- /virustotal -->'
          } >> body.md
          gh release edit "$TAG" --notes-file body.md
